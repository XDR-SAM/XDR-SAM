<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
<title id="title">Question. Experiment. Evaluate. Build. Operate.</title><desc id="desc">Custom orbital network artwork for Abdullah Al Sami. AI, machine learning research, and software engineering.</desc>
<style>
:root{--bg:#10130F;--ink:#F1F2E9;--muted:#A9B1A2;--accent:#C1F76D;--line:#30392B}
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace;letter-spacing:2px}
.orbit{transform-origin:0px 0px;animation:orbit 36s linear infinite}
.signal{animation:signal 6s ease-in-out infinite}
.flow{stroke-dasharray:5 12;animation:flow 12s linear infinite}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-170}}
@media(prefers-reduced-motion:reduce){.orbit,.signal,.flow{animation:none}}
</style>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="var(--line)"/></pattern>
<radialGradient id="glow"><stop stop-color="var(--accent)" stop-opacity=".12"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient></defs>
<rect width="640" height="400" rx="22" fill="var(--bg)"/><rect x="1" y="1" width="638" height="398" rx="21" fill="url(#grid)" stroke="var(--line)"/>
<text x="36" y="43" font-size="15" fill="var(--muted)" class="mono">FROM QUESTION TO SYSTEM</text><path d="M48 91 V351" stroke="var(--line)" stroke-width="2"/><path d="M48 91 V351" class="flow" stroke="var(--accent)" stroke-width="2"/><circle cx="48" cy="91" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/><text x="76" y="98" font-size="23" fill="var(--ink)" font-weight="700">Question</text><text x="255" y="98" font-size="21" fill="var(--muted)" >Define the problem</text><circle cx="48" cy="156" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/><text x="76" y="163" font-size="23" fill="var(--ink)" font-weight="700">Experiment</text><text x="255" y="163" font-size="21" fill="var(--muted)" >Test the assumptions</text><circle cx="48" cy="221" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/><text x="76" y="228" font-size="23" fill="var(--ink)" font-weight="700">Evaluate</text><text x="255" y="228" font-size="21" fill="var(--muted)" >Measure what matters</text><circle cx="48" cy="286" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/><text x="76" y="293" font-size="23" fill="var(--ink)" font-weight="700">Build</text><text x="255" y="293" font-size="21" fill="var(--muted)" >Make it useful</text><circle cx="48" cy="351" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/><text x="76" y="358" font-size="23" fill="var(--ink)" font-weight="700">Operate</text><text x="255" y="358" font-size="21" fill="var(--muted)" >Keep it reliable</text>
</svg>