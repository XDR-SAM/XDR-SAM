name: generate-snake-game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Platane/snk@v3
        with:
          github_user_name: XDR-SAM
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit and push snake SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/*.svg
          git diff --cached --quiet || git commit -m "chore: update snake game svgs"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/XDR-SAM/XDR-SAM.git
          git push origin HEAD:main
