name: generate-snake-game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/XDR-SAM/XDR-SAM.git .
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local --unset http.https://github.com/.extraheader || true

      - uses: Platane/snk@v3
        with:
          github_user_name: XDR-SAM
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Commit and push snake SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git add dist/*.svg
          git diff --cached --quiet || git commit -m "chore: update snake game svgs"
          GIT_TERMINAL_PROMPT=0 git push https://x-access-token:${GH_TOKEN}@github.com/XDR-SAM/XDR-SAM.git HEAD:main
